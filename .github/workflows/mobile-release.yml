name: Mobile Release

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        required: true
        type: choice
        options:
          - preview
          - production
      platform:
        description: Platform to build
        required: true
        type: choice
        options:
          - android
          - ios
          - all
      submit_to_store:
        description: Submit the latest production build after build completes
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    environment: mobile-release

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate mobile app config
        run: node scripts/validate-app-config.js

      - name: Run typecheck
        run: npm run typecheck

      - name: Prepare Android Firebase config
        if: ${{ inputs.platform == 'android' || inputs.platform == 'all' }}
        env:
          EXPO_ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.EXPO_ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$EXPO_ANDROID_GOOGLE_SERVICES_JSON" ]; then
            echo "EXPO_ANDROID_GOOGLE_SERVICES_JSON is required for Android push notifications." >&2
            exit 1
          fi
          mkdir -p secrets/push
          printf '%s' "$EXPO_ANDROID_GOOGLE_SERVICES_JSON" > secrets/push/google-services.json

      - name: Install EAS CLI
        run: npm install --global eas-cli

      - name: Run EAS build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_ANDROID_GOOGLE_SERVICES_FILE: ./secrets/push/google-services.json
        run: |
          eas build \
            --non-interactive \
            --profile "${{ inputs.profile }}" \
            --platform "${{ inputs.platform }}"

      - name: Submit Android production build
        if: ${{ inputs.submit_to_store && inputs.profile == 'production' && (inputs.platform == 'android' || inputs.platform == 'all') }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas submit --non-interactive --latest --profile production --platform android

      - name: Submit iOS production build
        if: ${{ inputs.submit_to_store && inputs.profile == 'production' && (inputs.platform == 'ios' || inputs.platform == 'all') }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_APPLE_ID: ${{ secrets.EXPO_APPLE_ID }}
          EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.EXPO_APPLE_APP_SPECIFIC_PASSWORD }}
        run: eas submit --non-interactive --latest --profile production --platform ios
