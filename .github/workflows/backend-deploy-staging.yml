name: Backend Deploy Staging

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'infra/**'
      - '.github/workflows/backend-deploy-staging.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: backend-staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    environment: staging

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install asyncpg

      - name: Compile backend app
        run: python -m compileall app

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Configure Docker auth
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Derive deployment metadata
        run: |
          IMAGE_URI="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPOSITORY }}/backend:${GITHUB_SHA}"
          SMOKE_PATH="${{ vars.BACKEND_SMOKE_PATH }}"
          if [ -z "$SMOKE_PATH" ]; then
            SMOKE_PATH="/health"
          fi
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"
          echo "SMOKE_PATH=$SMOKE_PATH" >> "$GITHUB_ENV"

      - name: Build backend image
        run: docker build -t "$IMAGE_URI" .

      - name: Push backend image
        run: docker push "$IMAGE_URI"

      - name: Run database migrations
        if: ${{ vars.GCP_MIGRATION_JOB != '' }}
        run: |
          SECRET_FLAGS=''
          ENV_FLAGS=''
          EXTRA_ARGS="${{ vars.BACKEND_DEPLOY_EXTRA_ARGS }}"
          if [ -n "${{ vars.BACKEND_SECRET_ENV_VARS }}" ]; then
            SECRET_FLAGS="--set-secrets ${{ vars.BACKEND_SECRET_ENV_VARS }}"
          fi
          if [ -n "${{ vars.BACKEND_RUNTIME_ENV_VARS }}" ]; then
            ENV_FLAGS="--set-env-vars ${{ vars.BACKEND_RUNTIME_ENV_VARS }}"
          fi

          gcloud run jobs deploy "${{ vars.GCP_MIGRATION_JOB }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --image "$IMAGE_URI" \
            --command alembic \
            --args upgrade,head \
            --task-timeout 1800s \
            $SECRET_FLAGS \
            $ENV_FLAGS \
            $EXTRA_ARGS \
            --quiet

          gcloud run jobs execute "${{ vars.GCP_MIGRATION_JOB }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --wait

      - name: Deploy backend service
        run: |
          SECRET_FLAGS=''
          ENV_FLAGS=''
          EXTRA_ARGS="${{ vars.BACKEND_DEPLOY_EXTRA_ARGS }}"
          if [ -n "${{ vars.BACKEND_SECRET_ENV_VARS }}" ]; then
            SECRET_FLAGS="--set-secrets ${{ vars.BACKEND_SECRET_ENV_VARS }}"
          fi
          if [ -n "${{ vars.BACKEND_RUNTIME_ENV_VARS }}" ]; then
            ENV_FLAGS="--set-env-vars ${{ vars.BACKEND_RUNTIME_ENV_VARS }}"
          fi

          gcloud run deploy "${{ vars.GCP_CLOUD_RUN_SERVICE }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --image "$IMAGE_URI" \
            --port 8000 \
            --allow-unauthenticated \
            $SECRET_FLAGS \
            $ENV_FLAGS \
            $EXTRA_ARGS \
            --quiet

      - name: Smoke test deployment
        run: |
          SERVICE_URL="$(gcloud run services describe "${{ vars.GCP_CLOUD_RUN_SERVICE }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --format='value(status.url)')"
          echo "Smoke testing ${SERVICE_URL}${SMOKE_PATH}"
          curl --fail --silent --show-error "${SERVICE_URL}${SMOKE_PATH}"
