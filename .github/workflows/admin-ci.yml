name: Admin CI

on:
  pull_request:
    paths:
      - 'admin/**'
      - '.github/workflows/admin-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'admin/**'
      - '.github/workflows/admin-ci.yml'
  workflow_dispatch:

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: admin

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint admin app
        run: npm run lint

      - name: Build admin app
        run: npm run build
